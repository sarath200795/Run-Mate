<!DOCTYPE html>
<html>
<head>
    <title>Conquest Live Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        
        /* LIVE HUD STYLES */
        #liveHUD {
            display: none; position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 500px; background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00e676; border-radius: 12px; z-index: 450;
            padding: 10px; grid-template-columns: repeat(3, 1fr); gap: 10px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3); font-family: 'Orbitron', sans-serif;
        }
        .hud-item { text-align: center; border-right: 1px solid #333; }
        .hud-item:last-child { border-right: none; }
        .hud-val { display: block; color: #00e676; font-size: 1.1rem; font-weight: bold; }
        .hud-lbl { display: block; color: #888; font-size: 0.6rem; text-transform: uppercase; }

        /* INDOOR INTERFACE */
        #indoorInterface {
            display: none; height: 100%; width: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            flex-direction: column; align-items: center; justify-content: center;
            color: white; position: absolute; top: 0; left: 0; z-index: 50;
        }
        
        /* SIDEBAR & UI */
        .sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 260px; background: rgba(15,15,15,0.98); border-right: 2px solid #8B0000; z-index: 400; transform: translateX(-100%); transition: 0.3s; color: white; display:flex; flex-direction:column; }
        .sidebar.open { transform: translateX(0); }
        .menu-toggle { position: absolute; top: 10px; left: 10px; z-index: 401; background: #8B0000; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; border: 2px solid #ff4444; font-family: 'Cinzel', serif; }
        
        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
        button, .nav-btn { padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; font-family: 'Cinzel', serif; text-transform: uppercase; text-decoration: none; text-align: center; flex: 1; }
        #startBtn { background: linear-gradient(180deg, #00e676, #00c853); color: #003300; }
        #stopBtn { background: linear-gradient(180deg, #ff1744, #d50000); color: white; display: none; }
        .home-btn { background: #fff; color: #000; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border: 2px solid #C5A059; border-radius: 8px; width: 85%; max-width: 350px; color: white; }
    </style>
</head>
<body>

    <div class="menu-toggle" id="menuBtn">☰ STATS</div>

    <div id="liveHUD">
        <div class="hud-item"><span class="hud-val" id="hudTime">00:00</span><span class="hud-lbl">Time</span></div>
        <div class="hud-item"><span class="hud-val" id="hudDist">0m</span><span class="hud-lbl">Dist</span></div>
        <div class="hud-item"><span class="hud-val" id="hudSteps">0</span><span class="hud-lbl">Steps</span></div>
        <div class="hud-item"><span class="hud-val" id="hudSpeed">0.0</span><span class="hud-lbl">Km/h</span></div>
        <div class="hud-item"><span class="hud-val" id="hudPace">0'00"</span><span class="hud-lbl">Pace</span></div>
        <div class="hud-item"><span class="hud-val" id="hudCal">0</span><span class="hud-lbl">Kcal</span></div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <button id="startBtn">⚔️ Start Conquest</button>
        <button id="stopBtn">🚩 Claim Territory</button>
        <div id="conquestNav" style="display: flex; gap: 10px; width: 100%;">
            <a href="dashboard.html" class="nav-btn home-btn">🏰 HOME</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, update, onValue, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://runmate-cb328-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let map, userMarker, activePolyline, watchId, timerInterval;
        let isTracking = false, startTime, totalMeters = 0;
        let stepCount = 0, lastAccelZ = 0, lastPos = null;
        
        const currentUser = localStorage.getItem('currentUser');
        let userWeight = parseInt(localStorage.getItem('userWeight')) || 75;
        let stepThreshold = parseInt(localStorage.getItem('stepSense')) || 15;

        window.initMap = function() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 19, center: { lat: 0, lng: 0 }, mapTypeId: 'terrain', disableDefaultUI: true,
                styles: [{elementType: 'geometry', stylers: [{color: '#242f3e'}]}]
            });
            navigator.geolocation.getCurrentPosition(p => {
                const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
                updateUserMarker(pos);
                map.setCenter(pos);
            });
        };

        function updateUserMarker(pos) {
            const iconData = localStorage.getItem('userIcon') || "👤";
            const isUrl = iconData.startsWith('http');
            if (!userMarker) {
                userMarker = new google.maps.Marker({
                    position: pos, map,
                    icon: isUrl ? { url: iconData, scaledSize: new google.maps.Size(42, 42) } : null,
                    label: !isUrl ? { text: iconData, fontSize: "24px" } : null
                });
            } else { userMarker.setPosition(pos); }
        }

        function handleMotion(event) {
            if (!isTracking) return;
            const acc = event.accelerationIncludingGravity;
            let delta = Math.abs(acc.z - lastAccelZ);
            if (delta > stepThreshold) { stepCount++; }
            lastAccelZ = acc.z;
        }

        function updateLiveStats(currentPos) {
            if (lastPos) {
                const d = google.maps.geometry.spherical.computeDistanceBetween(
                    new google.maps.LatLng(lastPos), new google.maps.LatLng(currentPos)
                );
                if (d > 1) totalMeters += d;
            }
            lastPos = currentPos;

            const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            const km = totalMeters / 1000;
            
            // Live Calculations
            const speed = (km / (elapsedSec / 3600)) || 0;
            const paceMin = (elapsedSec / 60) / km;
            const calories = km * userWeight * 1.03;

            // Update UI
            document.getElementById('hudTime').innerText = new Date(elapsedSec * 1000).toISOString().substr(14, 5);
            document.getElementById('hudDist').innerText = totalMeters > 1000 ? km.toFixed(2) + 'km' : Math.round(totalMeters) + 'm';
            document.getElementById('hudSteps').innerText = stepCount;
            document.getElementById('hudSpeed').innerText = speed.toFixed(1);
            document.getElementById('hudCal').innerText = Math.round(calories);

            if (km > 0.01) {
                const pMin = Math.floor(paceMin);
                const pSec = Math.floor((paceMin - pMin) * 60);
                document.getElementById('hudPace').innerText = `${pMin}'${pSec.toString().padStart(2, '0')}"`;
            }
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') await DeviceMotionEvent.requestPermission();
            
            isTracking = true;
            startTime = Date.now();
            totalMeters = 0; stepCount = 0; lastPos = null;
            
            document.getElementById('liveHUD').style.display = 'grid';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('conquestNav').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';

            window.addEventListener('devicemotion', handleMotion);
            
            watchId = navigator.geolocation.watchPosition(pos => {
                const pt = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                updateLiveStats(pt);
                updateUserMarker(pt);
                map.panTo(pt);
            }, null, { enableHighAccuracy: true });
        });

        document.getElementById('stopBtn').addEventListener('click', async () => {
            isTracking = false;
            window.removeEventListener('devicemotion', handleMotion);
            navigator.geolocation.clearWatch(watchId);
            
            const finalCal = (totalMeters / 1000) * userWeight * 1.03;
            const snap = await get(ref(db, `users/${currentUser}`));
            const userData = snap.val() || {};

            await update(ref(db, `users/${currentUser}`), {
                totalSteps: (userData.totalSteps || 0) + stepCount,
                totalCalories: (userData.totalCalories || 0) + finalCal
            });

            alert("Session Recorded!");
            location.reload();
        });

        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyAzfoxuzRbmyrhGChfTEWB05xvyNRmvK3k&libraries=geometry&callback=initMap`;
        document.head.appendChild(script);

    </script>
</body>
</html>
